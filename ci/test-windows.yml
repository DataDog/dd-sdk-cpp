    - if (Test-Path build) { remove-item -recurse -force build }
    - $env:TOOLCHAIN_IMAGE = "${env:DISTRIBUTION_REGISTRY}/${env:TOOLCHAIN_IMAGE_PATH}:${env:TOOLCHAIN_TARGET}-${env:WINDOWS_TOOLCHAIN_IMAGE_VERSION}"
    - >
      docker run --rm
      -m 8192M
      -e NUM_PARALLEL_BUILD_JOBS
      -v "$(Get-Location):C:\mnt"
      -w C:\mnt
      ${env:TOOLCHAIN_IMAGE}
      cmd /S /C "python -m venv .venv && .venv\Scripts\python.exe -m pip install -e .[integration-test] && cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDebugDLL -DDD_ENABLE_ASSERTS=ON -DDD_BUILD_EXAMPLES=ON -DDD_BUILD_TESTING=ON -DDD_CRASH_MODE=crashpad -DDD_RUN_CRASHPAD_TESTS=ON -S . -B build && cmake --build build --config Debug --parallel ${env:NUM_PARALLEL_BUILD_JOBS} && ctest --test-dir build --build-config Debug --output-on-failure && .venv\Scripts\python.exe tools\integration-test\main.py --crash-mode crashpad"
    - If ($LASTEXITCODE -ne "0") { throw "docker run (test) returned $LASTEXITCODE" }

compat-windows:
  # - COMPILE: Build with MSVC 17.14 on Windows x64
  # - CONFIG:  Validate Release build (test-windows handles Debug, including profiling),
  #            plus the profiling builds below, which also cover static-CRT and shared
  #            library variations
  # - CRASH:   Use the default crash handling implementation
  # - EXTRAS:  Build test binaries (static SDK only)
  # - PROFILER: Build dd-win-prof into the SDK where DD_ENABLE_PROFILING is ON
  # - RUNTIME: Run unit tests
  stage: test
  dependencies: []
  tags: [windows-v2:2022]
  variables:
    OVERRIDE_GIT_STRATEGY: clone  # Required for Windows runners
    TOOLCHAIN_TARGET: vs2022
  parallel:
    matrix:
      # Visual Studio 2022 (17.14, vc143): md-static-release, w/ WinHTTP
      - BUILD_CONFIGURATION: Release
        BUILD_SHARED_LIBS: "OFF"
        DD_CRASH_MODE: "inprocess"
        DD_BUILD_TESTING: "ON"
        DD_ENABLE_PROFILING: "OFF"
        CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreadedDLL
      # Same, with profiling (dd-win-prof) enabled: md-static-release
      - BUILD_CONFIGURATION: Release
        BUILD_SHARED_LIBS: "OFF"
        DD_BUILD_TESTING: "ON"
        DD_CRASH_MODE: "inprocess"
        DD_ENABLE_PROFILING: "ON"
        CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreadedDLL
      # Profiling, static CRT: mt-static-release
      - BUILD_CONFIGURATION: Release
        BUILD_SHARED_LIBS: "OFF"
        DD_BUILD_TESTING: "ON"
        DD_CRASH_MODE: "inprocess"
        DD_ENABLE_PROFILING: "ON"
        CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      # Profiling, shared SDK library: md-shared-release. Build only, as on Linux and
      # macOS: the unit tests link internal SDK symbols that a shared library does not
      # export, so tests can only be built against a static SDK
      - BUILD_CONFIGURATION: Release
        BUILD_SHARED_LIBS: "ON"
        DD_BUILD_TESTING: "OFF"
        DD_CRASH_MODE: "inprocess"
        DD_ENABLE_PROFILING: "ON"
        CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreadedDLL
  script:
    - $ErrorActionPreference = "Stop"
    - if (Test-Path build) { remove-item -recurse -force build }
    - $env:TOOLCHAIN_IMAGE = "${env:DISTRIBUTION_REGISTRY}/${env:TOOLCHAIN_IMAGE_PATH}:${env:TOOLCHAIN_TARGET}-${env:WINDOWS_TOOLCHAIN_IMAGE_VERSION}"
    - $env:DD_RUN_CRASHPAD_TESTS = if (${env:DD_CRASH_MODE} -eq "crashpad") { "ON" } else { "OFF" }
    - >
      docker run --rm
      -m 8192M
      -e NUM_PARALLEL_BUILD_JOBS
      -v "$(Get-Location):C:\mnt"
      -w C:\mnt
      ${env:TOOLCHAIN_IMAGE}
      cmd /S /C "cmake -DCMAKE_BUILD_TYPE=${env:BUILD_CONFIGURATION} -DBUILD_SHARED_LIBS=${env:BUILD_SHARED_LIBS} -DDD_CRASH_MODE=${env:DD_CRASH_MODE} -DDD_ENABLE_PROFILING=${env:DD_ENABLE_PROFILING} -DDD_RUN_CRASHPAD_TESTS=${env:DD_RUN_CRASHPAD_TESTS} -DCMAKE_MSVC_RUNTIME_LIBRARY=${env:CMAKE_MSVC_RUNTIME_LIBRARY} -DDD_BUILD_TESTING=${env:DD_BUILD_TESTING} -S . -B build && cmake --build build --config ${env:BUILD_CONFIGURATION} --parallel ${env:NUM_PARALLEL_BUILD_JOBS} && ctest --test-dir build --build-config ${env:BUILD_CONFIGURATION} --output-on-failure --no-tests=ignore"
    - If ($LASTEXITCODE -ne "0") { throw "docker run (cmake build) returned $LASTEXITCODE" }
