test-windows:
  # - COMPILE: Build with MSVC 17.14 on Windows x64
  # - CRASH:   Use the default crash handling implementation
  # - EXTRAS:  Build test binaries and examples
  # - RUNTIME: Run unit tests and integration tests
  stage: test
  dependencies: []
  tags: [windows-v2:2022]
  variables:
    OVERRIDE_GIT_STRATEGY: clone  # Required for Windows runners
    TOOLCHAIN_TARGET: vs2022
  script:
    - $ErrorActionPreference = "Stop"
    - if (Test-Path build) { remove-item -recurse -force build }
    - $env:TOOLCHAIN_IMAGE = "${env:DISTRIBUTION_REGISTRY}/${env:TOOLCHAIN_IMAGE_PATH}:${env:TOOLCHAIN_TARGET}-${env:WINDOWS_TOOLCHAIN_IMAGE_VERSION}"
    - >
      docker run --rm
      -m 8192M
      -e NUM_PARALLEL_BUILD_JOBS
      -v "$(Get-Location):C:\mnt"
      -w C:\mnt
      ${env:TOOLCHAIN_IMAGE}
      cmd /S /C "python -m venv .venv && .venv\Scripts\python.exe -m pip install -e .[integration-test] && cmake -DCMAKE_BUILD_TYPE=Debug -DMSVC_RUNTIME_LIBRARY=MultiThreadedDebugDLL -DDD_ENABLE_ASSERTS=ON -DDD_BUILD_EXAMPLES=ON -DDD_BUILD_TESTING=ON -S . -B build && cmake --build build --config Debug --parallel ${env:NUM_PARALLEL_BUILD_JOBS} && ctest --test-dir build --build-config Debug --output-on-failure && .venv\Scripts\python.exe tools\integration-test\main.py"
    - If ($LASTEXITCODE -ne "0") { throw "docker run (test) returned $LASTEXITCODE" }

test-windows-crashpad:
  # - COMPILE: Build with MSVC 17.14 on Windows x64
  # - CONFIG:  Debug build
  # - CRASH:   Use the Crashpad crash handling implementation
  # - EXTRAS:  Build test binaries and examples
  # - RUNTIME: Run Crashpad tests and SDK unit tests
  #            (integration tests temporarily disabled pending crash_smoke.py support)
  stage: test
  dependencies: []
  tags: [windows-v2:2022]
  variables:
    OVERRIDE_GIT_STRATEGY: clone  # Required for Windows runners
    TOOLCHAIN_TARGET: vs2022
  cache:
    - key:
        prefix: crashpad-source-windows-v1
        files: [chromium/crashpad/.gclient_entries]
      paths: [chromium/]
      when: always
  script:
    - $ErrorActionPreference = "Stop"
    - if (Test-Path build) { remove-item -recurse -force build }
    - $env:TOOLCHAIN_IMAGE = "${env:DISTRIBUTION_REGISTRY}/${env:TOOLCHAIN_IMAGE_PATH}:${env:TOOLCHAIN_TARGET}-${env:WINDOWS_TOOLCHAIN_IMAGE_VERSION}"
    - >
      docker run --rm
      -m 8192M
      -e NUM_PARALLEL_BUILD_JOBS
      -v "$(Get-Location):C:\mnt"
      -w C:\mnt
      ${env:TOOLCHAIN_IMAGE}
      cmd /S /C "python -m venv .venv && .venv\Scripts\python.exe -m pip install -e .[integration-test] && cmake -DCMAKE_BUILD_TYPE=Debug -DMSVC_RUNTIME_LIBRARY=MultiThreadedDebugDLL -DDD_ENABLE_ASSERTS=ON -DDD_BUILD_EXAMPLES=ON -DDD_BUILD_TESTING=ON -DDD_CRASH_MODE=crashpad -DDD_RUN_CRASHPAD_TESTS=ON -S . -B build && cmake --build build --config Debug --parallel ${env:NUM_PARALLEL_BUILD_JOBS} && ctest --test-dir build --build-config Debug --output-on-failure"
    - If ($LASTEXITCODE -ne "0") { throw "docker run (test) returned $LASTEXITCODE" }

compat-windows:
  # - COMPILE: Build with MSVC 17.14 on Windows x64
  # - CONFIG:  Validate Release build (test-windows handles Debug)
  # - CRASH:   Use the default crash handling implementation
  # - EXTRAS:  Build test binaries
  # - RUNTIME: Run unit tests
  stage: test
  dependencies: []
  tags: [windows-v2:2022]
  variables:
    OVERRIDE_GIT_STRATEGY: clone  # Required for Windows runners
    TOOLCHAIN_TARGET: vs2022
  parallel:
    matrix:
      # Visual Studio 2022 (17.14, vc143): md-static-release, w/ bundled libcurl
      - BUILD_CONFIGURATION: Release
        BUILD_SHARED_LIBS: "OFF"
        DD_CRASH_MODE: "inprocess"
        MSVC_RUNTIME_LIBRARY: MultiThreadedDLL
  script:
    - $ErrorActionPreference = "Stop"
    - if (Test-Path build) { remove-item -recurse -force build }
    - $env:TOOLCHAIN_IMAGE = "${env:DISTRIBUTION_REGISTRY}/${env:TOOLCHAIN_IMAGE_PATH}:${env:TOOLCHAIN_TARGET}-${env:WINDOWS_TOOLCHAIN_IMAGE_VERSION}"
    - $env:DD_RUN_CRASHPAD_TESTS = if (${env:DD_CRASH_MODE} -eq "crashpad") { "ON" } else { "OFF" }
    - >
      docker run --rm
      -m 8192M
      -e NUM_PARALLEL_BUILD_JOBS
      -v "$(Get-Location):C:\mnt"
      -w C:\mnt
      ${env:TOOLCHAIN_IMAGE}
      cmd /S /C "cmake -DCMAKE_BUILD_TYPE=${env:BUILD_CONFIGURATION} -DBUILD_SHARED_LIBS=${env:BUILD_SHARED_LIBS} -DDD_CRASH_MODE=${env:DD_CRASH_MODE} -DDD_RUN_CRASHPAD_TESTS=${env:DD_RUN_CRASHPAD_TESTS} -DMSVC_RUNTIME_LIBRARY=${env:MSVC_RUNTIME_LIBRARY} -DDD_BUILD_TESTING=ON -S . -B build && cmake --build build --config ${env:BUILD_CONFIGURATION} --parallel ${env:NUM_PARALLEL_BUILD_JOBS} && ctest --test-dir build --build-config ${env:BUILD_CONFIGURATION} --output-on-failure"
    - If ($LASTEXITCODE -ne "0") { throw "docker run (cmake build) returned $LASTEXITCODE" }
