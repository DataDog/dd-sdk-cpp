package-linux:
  stage: package
  dependencies: []
  tags: [arch:amd64]
  parallel:
    matrix:
      # linux-{arch}-clang-libstdc++-shared-release
      - TOOLCHAIN_TARGET: clang20
        BUILD_CONFIGURATION: RelWithDebInfo
        BUILD_SHARED_LIBS: "ON"
      # linux-{arch}-clang-libstdc++-static-release
      - TOOLCHAIN_TARGET: clang20
        BUILD_CONFIGURATION: RelWithDebInfo
        BUILD_SHARED_LIBS: "OFF"
  image: ${BUILD_STABLE_REGISTRY}/${TOOLCHAIN_IMAGE_PATH}:${TOOLCHAIN_TARGET}-${LINUX_TOOLCHAIN_IMAGE_VERSION}
  script:
    - cmake -DCMAKE_BUILD_TYPE=${BUILD_CONFIGURATION} -DBUILD_SHARED_LIBS=${BUILD_SHARED_LIBS} -DDD_ENABLE_GIT_REVISION_INFO=ON -S . -B build
    - cmake --build build --target package --parallel ${NUM_PARALLEL_BUILD_JOBS}
    - python3 tools/check-package/main.py build --build-shared-libs ${BUILD_SHARED_LIBS}
  artifacts:
    expire_in: "1 week"
    paths:
      - build/ddsdkcpp-*.zip

package-macos:
  stage: package
  dependencies: []
  tags: [macos:tart]
  image: ${MACOS_TART_IMAGE}
  parallel:
    matrix:
      # macos-{arch}-clang-libc++-shared-release
      - BUILD_CONFIGURATION: RelWithDebInfo
        BUILD_SHARED_LIBS: "ON"
        CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
        CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"
      # macos-{arch}-clang-libc++-static-release
      - BUILD_CONFIGURATION: RelWithDebInfo
        BUILD_SHARED_LIBS: "OFF"
        CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
        CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"
  script:
    - export PYENV_ROOT="$HOME/.pyenv"
    - export PATH="$PYENV_ROOT/shims:$PYENV_ROOT/bin:$PATH"
    - cmake -DCMAKE_BUILD_TYPE=${BUILD_CONFIGURATION} -DBUILD_SHARED_LIBS=${BUILD_SHARED_LIBS} -DCMAKE_OSX_DEPLOYMENT_TARGET=${CMAKE_OSX_DEPLOYMENT_TARGET} -DCMAKE_OSX_ARCHITECTURES=${CMAKE_OSX_ARCHITECTURES} -DDD_ENABLE_GIT_REVISION_INFO=ON -S . -B build
    - cmake --build build --target package --parallel ${NUM_PARALLEL_BUILD_JOBS}
    - python tools/check-package/main.py build --build-shared-libs ${BUILD_SHARED_LIBS}
  artifacts:
    expire_in: "1 week"
    paths:
      - build/ddsdkcpp-*.zip

package-windows:
  stage: package
  dependencies: []
  tags: [windows-v2:2022]
  variables:
    OVERRIDE_GIT_STRATEGY: clone  # Required for Windows runners
    TOOLCHAIN_TARGET: vs2022
  parallel:
    matrix:
      # windows-x64-msvc143-md-shared-release
      - BUILD_CONFIGURATION: RelWithDebInfo
        BUILD_SHARED_LIBS: "ON"
        CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreadedDLL
      # windows-x64-msvc143-md-static-release
      - BUILD_CONFIGURATION: RelWithDebInfo
        BUILD_SHARED_LIBS: "OFF"
        CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreadedDLL
  script:
    - $ErrorActionPreference = "Stop"
    - if (Test-Path build) { remove-item -recurse -force build }
    - $env:TOOLCHAIN_IMAGE = "${env:DISTRIBUTION_REGISTRY}/${env:TOOLCHAIN_IMAGE_PATH}:${env:TOOLCHAIN_TARGET}-${env:WINDOWS_TOOLCHAIN_IMAGE_VERSION}"
    - >
      docker run --rm
      -m 8192M
      -v "$(Get-Location):C:\mnt"
      -w C:\mnt
      ${env:TOOLCHAIN_IMAGE}
      cmd /S /C "cmake -DCMAKE_BUILD_TYPE=${env:BUILD_CONFIGURATION} -DBUILD_SHARED_LIBS=${env:BUILD_SHARED_LIBS} -DCMAKE_MSVC_RUNTIME_LIBRARY=${env:CMAKE_MSVC_RUNTIME_LIBRARY} -DDD_ENABLE_GIT_REVISION_INFO=ON -S . -B build && cmake --build build --config ${env:BUILD_CONFIGURATION} --target package --parallel ${env:NUM_PARALLEL_BUILD_JOBS} && python tools\check-package\main.py build --build-shared-libs ${env:BUILD_SHARED_LIBS}"
    - If ($LASTEXITCODE -ne "0") { throw "docker run (cmake build) returned $LASTEXITCODE" }
  artifacts:
    expire_in: 1 week
    paths:
      - build/ddsdkcpp-*.zip
