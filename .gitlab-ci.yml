stages:
  - ci-image
  - build

variables:
  CURRENT_CI_IMAGE: "1"
  BUILD_STABLE_REGISTRY: 486234852809.dkr.ecr.us-east-1.amazonaws.com
  CI_IMAGE_REPO: "ci/dd-sdk-cpp"
  CI_IMAGE_DOCKER: ${BUILD_STABLE_REGISTRY}/${CI_IMAGE_REPO}:$CURRENT_CI_IMAGE
  IS_ON_CI: $CI

ci-image:
  when: manual
  stage: ci-image
  except: [ tags, schedules ]
  tags: [ "arch:amd64" ]
  image: "$BUILDENV_REGISTRY/images/docker:24.0.4-gbi-focal"
  script:
    - docker buildx build --tag registry.ddbuild.io/${CI_IMAGE_REPO}:${CURRENT_CI_IMAGE} --label target=build -f Dockerfile.gitlab --push .

build:
  stage: build
  tags:
    - arch:amd64
  image: $CI_IMAGE_DOCKER
  script:
    - cmake . -B 'build'
    - cmake --build build --target format-check
    - cmake --build build --config debug
    - ctest -C debug --test-dir build --output-junit test-results/test-results.xml
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/build/test-results/*.xml
