stages:
  - build-toolchain-images
#temp#  - validate
#temp#  - build
  - integration
#temp#  - package
#temp#  - release

variables:
  # We must explicitly specify `--parallel <jobs>` when building targets that invoke C++
  # compiles - otherwise, Ninja will run with `-n 41` by default, since it's looking at
  # nproc and not at the actual resource constraints of the Kubernetes pod.
  NUM_PARALLEL_BUILD_JOBS: "8"

  # By default, resource allocation for Datadog CI runners is 1 vCPU and 2 GB RAM. In
  # template-heavy TUs, clang-tidy can reach a maximum resident set size in the ballpark
  # of 512 MB, +/- 100 MB, so 1GB per CPU gives us a reasonable safety margin.
  KUBERNETES_CPU_REQUEST: "8"
  KUBERNETES_CPU_LIMIT: "8"
  KUBERNETES_MEMORY_REQUEST: "8Gi"
  KUBERNETES_MEMORY_LIMIT: "8Gi"

  # Docker registries: we push to registry.ddbuild.io and it replicates to ECR, which
  # Linux runners have access to
  DISTRIBUTION_REGISTRY: registry.ddbuild.io
  BUILD_STABLE_REGISTRY: 486234852809.dkr.ecr.us-east-1.amazonaws.com

  # In order to build Linux toolchain images in CI, we use Docker-in-Docker: this is the
  # image that lets us run Docker builds for that job
  DIND_IMAGE: images/docker:24.0.4-jammy  # Based on a Golden Base Image (GBI) 

  # Our Linux toolchain images are tagged with this version, e.g.
  # 'ci/dd-sdk-cpp:clang15-v2': bump and trigger the job to rebuild
  TOOLCHAIN_IMAGE_PATH: ci/dd-sdk-cpp
  LINUX_TOOLCHAIN_IMAGE_VERSION: v6-b

  # The Windows (MSVC) toolchain image is built separately: since Windows images tend to
  # be large, they are also tagged '<toolchain>-latest' on push, and then the AMI build
  # in `ci-platform-machine-images` pre-pulls the image using that tag. If you bump this
  # version, your Windows CI builds may be slower until the next time Windows runner
  # AMIs are rebuilt.
  WINDOWS_TOOLCHAIN_IMAGE_VERSION: v3-b

  # clang-20 is our golden-path toolchain for development: use the clang-20 image to
  # validate builds with full linting, format checks, etc.
  GOLDEN_LINUX_TOOLCHAIN_TARGET: clang20
  GOLDEN_LINUX_IMAGE: ${BUILD_STABLE_REGISTRY}/${TOOLCHAIN_IMAGE_PATH}:${GOLDEN_LINUX_TOOLCHAIN_TARGET}-${LINUX_TOOLCHAIN_IMAGE_VERSION}

# Stage 'build-toolchain-images' is triggered manually whenever we need to build new
# Docker images for use in later stages of the pipeline to run Linux and Windows builds.
# A Linux toolchain image has CMake, Ninja, and a specific version of GCC or Clang.
# A Windows toolchain image has CMake and a specific version of Visual Studio + MSVC.
# macOS runners use a specific dd-sdk-cpp-sonoma AMI in lieu of Docker.

build-toolchain-image-linux:
  stage: build-toolchain-images
  when: manual
  except: [tags, schedules]
  tags: [arch:amd64]
  image: ${BUILD_STABLE_REGISTRY}/${DIND_IMAGE}
  parallel:
    matrix:
      - TOOLCHAIN_TARGET: [gcc11, gcc13, clang15, clang20]
  script:
    - export TOOLCHAIN_IMAGE="${DISTRIBUTION_REGISTRY}/${TOOLCHAIN_IMAGE_PATH}:${TOOLCHAIN_TARGET}-${LINUX_TOOLCHAIN_IMAGE_VERSION}"
    - docker buildx build --target ${TOOLCHAIN_TARGET} --tag ${TOOLCHAIN_IMAGE} --label target=build --push ./ci/linux

build-toolchain-image-windows:
  stage: build-toolchain-images
  when: manual
  except: [tags, schedules]
  tags: [windows-v2:2022]
  id_tokens:
    CI_IDENTITY_GITLAB_JWT:
      aud: https://vault.us1.ddbuild.io  # Required for docker push
  variables:
    CI_IDENTITY_ROLE_NAME_OVERRIDE: windows-ci-tmp-gitlab-id-token-dd-sdk-cpp-all-refs  # Required for docker push
    OVERRIDE_GIT_STRATEGY: clone  # Required for Windows runners
    TOOLCHAIN_TARGET: vs2022  # Visual Studio 2022 17.14; MSVC v143
  # Build a Docker image, then tag it as both (e.g.) 'vs2022-v1' and 'vs2022-latest':
  # the latter tag is used to cache the latest image locally when building Windows
  # runner AMIs (see `pre-pull-docker-images.ps1` in ci-platform-machine-images)
  script:
    - $ErrorActionPreference = "Stop"
    - $env:TOOLCHAIN_IMAGE = "${env:DISTRIBUTION_REGISTRY}/${env:TOOLCHAIN_IMAGE_PATH}:${env:TOOLCHAIN_TARGET}-${env:WINDOWS_TOOLCHAIN_IMAGE_VERSION}"
    - $env:TOOLCHAIN_IMAGE_LATEST = "${env:DISTRIBUTION_REGISTRY}/${env:TOOLCHAIN_IMAGE_PATH}:${env:TOOLCHAIN_TARGET}-latest"
    - docker build --tag ${env:TOOLCHAIN_IMAGE} --label target=build ./ci/windows
    - If ($LASTEXITCODE -ne "0") { throw "docker build returned $LASTEXITCODE" }
    - docker tag ${env:TOOLCHAIN_IMAGE} ${env:TOOLCHAIN_IMAGE_LATEST}
    - If ($LASTEXITCODE -ne "0") { throw "docker tag returned $LASTEXITCODE" }
    - docker push ${env:TOOLCHAIN_IMAGE}
    - If ($LASTEXITCODE -ne "0") { throw "docker push returned $LASTEXITCODE" }
    - docker push ${env:TOOLCHAIN_IMAGE_LATEST}
    - If ($LASTEXITCODE -ne "0") { throw "docker push returned $LASTEXITCODE" }

