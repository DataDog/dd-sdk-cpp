# Stage 'integration' runs integration tests on all supported platforms

# TEMP: For now, just verify that we have the vault CLI installed on all platforms, and
# examine basic vault state

integration-test-linux:
  stage: integration
  dependencies: []
  tags: [arch:amd64]
  image: ${GOLDEN_LINUX_IMAGE}
  script:
    - echo "CI is $CI"
    - echo "CI_RUNNER_TAGS is $CI_RUNNER_TAGS"
    - echo "KUBERNETES_SERVICE_HOST is $KUBERNETES_SERVICE_HOST"
    - echo "VAULT_ADDR is $VAULT_ADDR"
    - vault --version
    - vault status
    - vault token lookup || echo 'no vault token'

integration-test-macos:
  stage: integration
  dependencies: []
  tags: [macos:sonoma, specific:true] # Use AMI dd-sdk-cpp-sonoma, w/ Xcode 15.3.0, AppleClang 15
  script:
    - echo "CI is $CI"
    - echo "CI_RUNNER_TAGS is $CI_RUNNER_TAGS"
    - echo "KUBERNETES_SERVICE_HOST is $KUBERNETES_SERVICE_HOST"
    - echo "VAULT_ADDR is $VAULT_ADDR"
    - vault --version
    - vault status
    - vault login -method=aws -no-print  # macOS runners must obtain a Vault token using AWS IAM authentication
    - vault token lookup || echo 'no vault token'

integration-test-windows:
  stage: integration
  dependencies: []
  tags: [windows-v2:2022]
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  variables:
    CI_IDENTITIES_CLIENT_VERSION: v0.1.0
    OVERRIDE_GIT_STRATEGY: clone  # Required for Windows runners
    TOOLCHAIN_TARGET: vs2022
  script:
    - $ErrorActionPreference = "Stop"
    - aws s3 cp "s3://binaries-ddbuild-io-prod/ci-identities/ci-identities-gitlab-job-client/versions/${env:CI_IDENTITIES_CLIENT_VERSION}/ci-identities-gitlab-job-client-windows-amd64.exe" ./ci-identities-gitlab-job-client.exe
    - .\ci-identities-gitlab-job-client.exe assume-role

